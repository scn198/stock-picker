name: 每日选股 + 微信推送

# 北京时间每天 15:10（= UTC 07:10）跑一次选股，收盘后数据最完整。
# GitHub 的定时任务在高峰期可能延迟几分钟，15:10 已收盘，延迟无影响。
on:
  schedule:
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "策略模式"
        type: choice
        default: short
        options:
          - short
          - long
      skip_push:
        description: "只跑不推送（调试用）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-pick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # mootdx 0.11.7 声明 httpx<0.26，与 asharehub 的 httpx>=0.27 无解，
      # 所以单独 --no-deps 安装并手工补齐它的运行依赖。详见 requirements-ci.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install --no-deps "mootdx==0.11.7"
          pip install tdxpy prettytable py-mini-racer tenacity click tqdm

      # predictions.db / 因子库 / K 线缓存跨运行累积，复权与 T+1 回填才有历史可比。
      # 每个 run 一个新 key，靠 restore-keys 继承上一次的缓存。
      - name: 恢复运行期数据库与缓存
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/weights
          key: sp-runtime-${{ github.run_id }}
          restore-keys: |
            sp-runtime-

      - name: 运行选股
        env:
          TZ: Asia/Shanghai
          ASHAREHUB_API_KEY: ${{ secrets.ASHAREHUB_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'short' }}"
          echo "策略模式: $MODE"
          python scripts/eod_stock_picker.py --mode "$MODE" --out reports/daily.md

      - name: 推送到微信（pushplus）
        if: ${{ github.event.inputs.skip_push != 'true' }}
        env:
          TZ: Asia/Shanghai
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python scripts/push_pushplus.py --in reports/daily.md \
            --fallback "今日简报生成失败，请查看 Actions 运行日志"

      - name: 保存简报工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
